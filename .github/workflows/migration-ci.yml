name: Migration CI (next-main)

# Validation for the long-lived Next.js migration integration branch (ADR-001 Option A).
# NON-DEPLOYING by design: it runs the root Vite regression and the nested next/ foundation
# checks, and NEVER deploys. The Vite staging/production deploy (deploy.yml) triggers only on
# push:[main]; migration/next-main must never trigger production deployment or change traffic.
on:
  pull_request:
    branches: [migration/next-main]
  push:
    branches: [migration/next-main]

concurrency:
  group: migration-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vite-regression:
    name: Root Vite regression (no deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install (frozen)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json
      - name: Unit tests
        run: bun run test
      - name: Build (core; deploy-only prebuild/postbuild + secrets excluded)
        run: bunx vite build

  next-foundation:
    name: Nested Next foundation (next/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install (frozen, next/)
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Architecture + smoke tests
        run: bun run test
      - name: Production build (standalone)
        # NEXT_PUBLIC_CMS_API_URL is required for `next build` (build-time browser config for
        # the lead-form POST; the config gate fails the build without it). CI is a
        # build/regression environment, not a deployment, so an explicit public localhost
        # value is honest here — the gate exists to forbid an IMPLICIT localhost fallback, not
        # an explicit CI value. A real deployment build (MIG-010) sets the production CMS base.
        env:
          NEXT_PUBLIC_CMS_API_URL: http://localhost:8080/api/v1
        run: bun run build
      - name: Package self-contained standalone artifact
        run: bun run package:standalone
      - name: Standalone locale routing matrix + artifact probes
        run: |
          set -euo pipefail
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          SRV=$!
          trap 'kill "${SRV}" 2>/dev/null || true' EXIT
          # Single bounded readiness poll with a short overall deadline; fail explicitly if
          # the server never becomes ready (do not proceed against an unready server).
          deadline=$((SECONDS + 30))
          until curl -sf --connect-timeout 3 --max-time 5 http://127.0.0.1:3000/api/health >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo "standalone server did not become ready within 30s" >&2
              exit 1
            fi
            sleep 1
          done
          # Full locale routing matrix (redirects + query preservation, locales + document
          # lang, dotted-route normalization, real 404s, api/probe/README/static bypass, hreflang)
          # against the packaged artifact.
          BASE_URL=http://127.0.0.1:3000 bash scripts/validation/locale-routing-matrix.sh
          # SEO plane acceptance (FND-003): canonical/hreflang matrix, robots, sitemap,
          # duplicate-canonical and env-leak checks against the packaged artifact.
          BASE_URL=http://127.0.0.1:3000 bash scripts/validation/seo-acceptance.sh
          # Public probe exact body + a real generated static asset 200.
          test "$(curl -s --connect-timeout 3 --max-time 10 http://127.0.0.1:3000/foundation-probe.txt)" = "thg-public-web foundation probe ok"
          ASSET="$(cd .next/standalone/.next/static && find . -type f \( -name '*.js' -o -name '*.css' \) -print -quit | sed 's#^\./#/_next/static/#')"
          test -n "${ASSET}"
          test "$(curl -s --connect-timeout 3 --max-time 10 -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${ASSET}")" = "200"
          echo "standalone locale + artifact validation OK"
