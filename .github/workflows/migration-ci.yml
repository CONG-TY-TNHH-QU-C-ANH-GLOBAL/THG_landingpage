name: Migration CI (next-main)

# Validation for the long-lived Next.js migration integration branch (ADR-001 Option A).
# NON-DEPLOYING by design: it runs the root Vite regression and the nested next/ foundation
# checks, and NEVER deploys. The Vite staging/production deploy (deploy.yml) triggers only on
# push:[main]; migration/next-main must never trigger production deployment or change traffic.
on:
  pull_request:
    branches: [migration/next-main]
  push:
    branches: [migration/next-main]

concurrency:
  group: migration-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vite-regression:
    name: Root Vite regression (no deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install (frozen)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json
      - name: Unit tests
        run: bun run test
      - name: Build (core; deploy-only prebuild/postbuild + secrets excluded)
        run: bunx vite build

  next-foundation:
    name: Nested Next foundation (next/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install (frozen, next/)
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Architecture + smoke tests
        run: bun run test
      - name: Production build (standalone)
        run: bun run build
      - name: Standalone artifact validation
        run: |
          set -euo pipefail
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          SRV=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break || sleep 1
          done
          BODY="$(curl -s http://127.0.0.1:3000/api/health)"
          echo "health: ${BODY}"
          test "${BODY}" = '{"status":"ok","service":"thg-public-web","runtime":"next"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/nope)" = "404"
          kill "${SRV}"
