name: Build and Deploy Landing Page

on:
  push:
    branches: [main]
  workflow_dispatch:
  # C3 auto-redeploy: the CMS Worker fires this when a JD is published/edited/
  # closed so /careers/:slug pages re-prerender + sitemap updates.
  repository_dispatch:
    types: [cms-content-updated]

# Coalesce builds: never cancel a running deploy mid-SSH-copy, but GitHub
# cancels any earlier QUEUED run when a newer one arrives — so a burst of CMS
# edits collapses to (at most) one running + one pending (always the latest)
# build instead of N deploys. Combined with the CMS-side 1-min cron coalescing.
concurrency:
  group: landing-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Safety guard (ADR-001 Option A): deployment runs ONLY for the main branch.
    # A manual workflow_dispatch from any other ref (e.g. migration/next-main) is a no-op.
    # Preserves push:[main] auto-deploy and the CMS repository_dispatch redeploy, whose
    # ref is the default branch (refs/heads/main). No build logic/secrets/artifacts change.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── CMS type drift gate (Phase D3.3) ───────────────────────────────
      # Regenerates src/lib/cms-generated.d.ts from the live CMS OpenAPI
      # spec and fails if the committed file no longer matches. This catches
      # the failure mode where a backend annotation changed but a downstream
      # frontend PR forgot to regenerate. The committed file is the
      # contract-of-record between repos.
      - name: Check CMS types are up-to-date
        if: vars.SKIP_CMS_TYPE_CHECK != '1'
        env:
          VITE_CMS_API_URL: ${{ secrets.VITE_CMS_API_URL }}
        run: bun run check:cms-types

      # Audit trail when the gate is bypassed via the repository variable.
      # Admins set vars.SKIP_CMS_TYPE_CHECK=1 (Settings → Secrets and
      # variables → Actions → Variables) during a CMS outage to keep
      # landing CI green. The ::notice annotation appears in PR Checks so
      # the bypass is visible at review time. UNSET the variable after
      # the incident is resolved.
      - name: Notice — CMS type check bypassed (audit)
        if: vars.SKIP_CMS_TYPE_CHECK == '1'
        run: |
          echo "::notice title=CMS type check bypassed::Repository variable SKIP_CMS_TYPE_CHECK=1 is set. cms-generated.d.ts drift detection is OFF. Verify no backend schema changes are in this PR. Unset SKIP_CMS_TYPE_CHECK in repo Settings → Variables when CMS is reachable again."

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Unit tests
        run: bun run test

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        env:
          # Force the DEV_BYPASS path so the test doesn't depend on a live
          # Turnstile site key. Production builds (next step) still get the key.
          VITE_TURNSTILE_SITE_KEY: ""
          VITE_CMS_API_URL: "http://localhost:8080/api/v1"
        run: bun run test:e2e

      - name: Build
        env:
          # CMS API base URL for prod (REQUIRED — fallback would point to localhost)
          VITE_CMS_API_URL: ${{ secrets.VITE_CMS_API_URL }}
          # Catalog API (legacy public catalog service). Optional — if blank,
          # falls back to https://hub.thgfulfill.com/api/public/catalog at runtime.
          VITE_CATALOG_API_URL: ${{ secrets.VITE_CATALOG_API_URL }}
          # Optional analytics — TrackingScripts skips injection when blank
          VITE_GA4_ID: ${{ secrets.VITE_GA4_ID }}
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
          VITE_FB_PIXEL_ID: ${{ secrets.VITE_FB_PIXEL_ID }}
          VITE_TIKTOK_PIXEL_ID: ${{ secrets.VITE_TIKTOK_PIXEL_ID }}
          SEO_BUILD_STRICT: "1"
          # Optional Turnstile — LeadFormDialog uses DEV_BYPASS when blank
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "${VITE_CMS_API_URL}" ]; then
            echo "::error::Missing secret VITE_CMS_API_URL — landing build would default to localhost. Add it in GitHub repo settings → Secrets."
            exit 1
          fi
          bun run build

      - name: Upload SEO build report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seo-build-report
          path: dist/seo-build-report.json

      - name: Snapshot current production artifact
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -eu
            sudo rm -rf /var/www/thgfulfill.previous
            if [ -d /var/www/thgfulfill ]; then
              sudo cp -a /var/www/thgfulfill /var/www/thgfulfill.previous
            fi

      - name: Deploy to server via SSH
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "dist/*"
          target: /var/www/thgfulfill
          strip_components: 1
          overwrite: true
          rm: true

      - name: Configure isolated landing virtual host and SEO routing
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -eu
            # Keep the sales application vhost completely separate. The landing
            # site is static/prerendered and must own its exact host names.
            NGINX_CONF="/etc/nginx/sites-available/thgfulfill"
            NGINX_LINK="/etc/nginx/sites-enabled/thgfulfill"
            NGINX_BACKUP="/tmp/thgfulfill.nginx.previous"
            CERT="/etc/ssl/cloudflare/thgfulfill-origin.pem"
            CERT_KEY="/etc/ssl/cloudflare/thgfulfill-origin.key"

            # A wildcard certificate does not cover the apex hostname. Refuse
            # to publish a broken Full (strict) origin until the dedicated
            # certificate for both thgfulfill.com and *.thgfulfill.com exists.
            if ! sudo test -s "$CERT" || ! sudo test -s "$CERT_KEY"; then
              echo "::error::Missing THG landing Cloudflare Origin certificate at $CERT / $CERT_KEY" >&2
              exit 1
            fi
            if ! sudo openssl x509 -in "$CERT" -noout -ext subjectAltName | grep -q 'DNS:thgfulfill.com'; then
              echo "::error::Landing origin certificate does not cover thgfulfill.com" >&2
              exit 1
            fi
            if sudo test -f "$NGINX_CONF"; then
              sudo cp "$NGINX_CONF" "$NGINX_BACKUP"
            fi
            sudo tee $NGINX_CONF > /dev/null << 'EOF'
            server {
                listen 80;
                listen [::]:80;
                server_name thgfulfill.com www.thgfulfill.com;
                return 308 https://thgfulfill.com$request_uri;
            }

            server {
                listen 443 ssl http2;
                listen [::]:443 ssl http2;
                server_name www.thgfulfill.com;
                ssl_certificate     /etc/ssl/cloudflare/thgfulfill-origin.pem;
                ssl_certificate_key /etc/ssl/cloudflare/thgfulfill-origin.key;
                return 308 https://thgfulfill.com$request_uri;
            }

            server {
                listen 443 ssl http2;
                listen [::]:443 ssl http2;
                server_name thgfulfill.com;

                root /var/www/thgfulfill;
                index index.html;
                ssl_certificate     /etc/ssl/cloudflare/thgfulfill-origin.pem;
                ssl_certificate_key /etc/ssl/cloudflare/thgfulfill-origin.key;
                ssl_protocols TLSv1.2 TLSv1.3;
                server_tokens off;

                # Canonical URL and legacy route handling.
                location = / { return 308 https://thgfulfill.com/vi; }
                location ~ ^/(en|vi|zh)/$ { return 308 https://thgfulfill.com/$1; }
                location ~ ^/(en|vi|zh)/(.*)/$ { return 308 https://thgfulfill.com/$1/$2; }
                location ~ ^/(policy|shipping-policy|blog|international-pricing|domestic-pricing|chinh-ngach-pricing|thg-fulfill|thg-express|thg-warehouse|thg-order|catalog|tracking|careers|community)(/.*)?$ {
                    return 308 https://thgfulfill.com/vi$request_uri;
                }

                # Prerendered files only: unknown paths receive an actual 404,
                # never the SPA shell (which Google treats as a soft-404 risk).
                location ~* \.html$ {
                    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                    add_header Pragma "no-cache" always;
                    add_header Expires "0" always;
                }
                location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|webp|avif)$ {
                    expires 1y;
                    add_header Cache-Control "public, immutable" always;
                }
                location / {
                    # Extensionless prerendered routes (for example /vi and
                    # /vi/domestic-pricing) resolve to index.html via
                    # try_files. Apply the same no-store policy as .html files
                    # so browsers never keep a previous page's content after a
                    # deployment; hashed assets above remain immutable.
                    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                    add_header Pragma "no-cache" always;
                    add_header Expires "0" always;
                    try_files $uri $uri/index.html =404;
                }
                location ~ /\. { deny all; }
            }
            EOF
            sudo ln -sfn "$NGINX_CONF" "$NGINX_LINK"
            if sudo nginx -t; then
              sudo systemctl reload nginx
            else
              if sudo test -f "$NGINX_BACKUP"; then sudo cp "$NGINX_BACKUP" "$NGINX_CONF"; else sudo rm -f "$NGINX_CONF" "$NGINX_LINK"; fi
              sudo rm -rf /var/www/thgfulfill
              sudo cp -a /var/www/thgfulfill.previous /var/www/thgfulfill
              sudo nginx -t
              sudo systemctl reload nginx
              echo "Nginx SEO routing was invalid; previous config and artifact restored." >&2
              exit 1
            fi

      - name: SEO smoke crawl against the deployed origin
        id: origin-seo-smoke
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -eu
            origin='127.0.0.1'
            base='https://thgfulfill.com'
            failed=0
            exact_one() {
              name="$1"
              pattern="$2"
              body="$3"
              count="$(printf '%s' "$body" | grep -ioE "$pattern" | wc -l || true)"
              if [ "$count" -ne 1 ]; then
                echo "$route: $name count is $count" >&2
                failed=1
              fi
            }
            for route in /vi /en/thg-express /vi/domestic-pricing; do
              html="$(curl --fail --silent --show-error --resolve "thgfulfill.com:443:$origin" -k "$base$route")" || { failed=1; continue; }
              [ "$(printf '%s' "$html" | wc -c)" -ge 10000 ] || { echo "$route: response resembles SPA shell" >&2; failed=1; }
              exact_one title '<title([^>]*)?>' "$html"
              # Match the primary SEO fields exactly; do not count Twitter's
              # separate `twitter:description` card metadata as a duplicate.
              exact_one description '<meta[[:space:]][^>]*name="description"[^>]*>' "$html"
              exact_one canonical '<link[[:space:]][^>]*rel="canonical"[^>]*>' "$html"
              exact_one robots '<meta[[:space:]][^>]*name="robots"[^>]*>' "$html"
              exact_one H1 '<h1([^>]*)?>' "$html"
            done
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --resolve "thgfulfill.com:443:$origin" -k "$base/vi/seo-smoke-route-that-must-not-exist")"
            [ "$status" = 404 ] || { echo "unknown route: expected 404, got $status" >&2; failed=1; }
            # HTTP reaches HTTPS in two hops: resolve both ports locally so the
            # check never accidentally follows the public DNS record mid-cutover.
            redirect="$(curl --silent --show-error --location --resolve "thgfulfill.com:80:$origin" --resolve "thgfulfill.com:443:$origin" -k -o /dev/null -w '%{url_effective}' http://thgfulfill.com/)"
            [ "$redirect" = 'https://thgfulfill.com/vi' ] || { echo "root redirect: got $redirect" >&2; failed=1; }
            redirect="$(curl --silent --show-error --resolve "www.thgfulfill.com:443:$origin" -k -D - -o /dev/null https://www.thgfulfill.com/en/ | awk 'tolower($1) == "location:" { print $2 }' | tr -d '\r')"
            [ "$redirect" = 'https://thgfulfill.com/en/' ] || { echo "www redirect: got $redirect" >&2; failed=1; }
            [ "$failed" -eq 0 ]

      # Cloudflare caches public HTML at the edge (Cache Rule "Cache Public HTML
      # Only", Edge TTL 1h). Without a purge, visitors — and the public smoke
      # crawl below — can be served the previous release for up to that TTL.
      # Runs before the public crawl so that check validates the new artifact.
      # Missing secrets downgrade to a warning: a stale edge cache expires on
      # its own, so it must not fail a release that deployed correctly.
      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ZONE_ID:-}" ]; then
            echo "::warning::CF_API_TOKEN / CF_ZONE_ID not set — skipping edge purge"
            exit 0
          fi
          response="$(curl --silent --show-error --fail-with-body \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"
          echo "$response"
          case "$response" in
            *'"success":true'*) echo "Edge cache purged." ;;
            *) echo "::error::Cloudflare purge failed" >&2; exit 1 ;;
          esac

      - name: Public production SEO smoke crawl
        id: public-seo-smoke
        if: vars.PUBLIC_SEO_SMOKE == '1'
        continue-on-error: true
        env:
          SITE_BASE: https://thgfulfill.com
        run: node scripts/smoke-production-seo.mjs

      - name: Roll back failed production artifact
        if: steps.origin-seo-smoke.outcome == 'failure' || steps.public-seo-smoke.outcome == 'failure'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -eu
            test -d /var/www/thgfulfill.previous
            sudo rm -rf /var/www/thgfulfill
            sudo cp -a /var/www/thgfulfill.previous /var/www/thgfulfill
            sudo nginx -t
            sudo systemctl reload nginx

      - name: Fail release after rollback
        if: steps.origin-seo-smoke.outcome == 'failure' || steps.public-seo-smoke.outcome == 'failure'
        run: |
          echo "::error::Production SEO smoke failed. Previous artifact was restored."
          exit 1
