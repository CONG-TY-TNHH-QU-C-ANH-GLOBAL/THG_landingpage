name: Build and Deploy Landing Page

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "dist/*"
          target: /var/www/thgfulfill
          strip_components: 1
          overwrite: true
          rm: true

      - name: Configure nginx cache headers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # Ensure nginx doesn't cache index.html so new deploys take effect immediately
            NGINX_CONF="/etc/nginx/snippets/thg-cache.conf"
            sudo tee $NGINX_CONF > /dev/null << 'EOF'
            # HTML files: never cache (so new deploys are picked up immediately)
            location ~* \.html$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                add_header Expires "0" always;
            }
            # Hashed assets (JS/CSS/images): cache aggressively (Vite adds content hash)
            location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
                expires 1y;
                add_header Cache-Control "public, immutable" always;
            }
            EOF
            # Test and reload nginx (only if config is valid)
            sudo nginx -t && sudo systemctl reload nginx || echo "nginx config unchanged"
